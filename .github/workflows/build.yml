# Budowanie instalatorów adCheckera — Windows (.exe) i macOS (.dmg, Apple Silicon).
# Rusza przy każdym wypchnięciu zmian w programie. Numer wersji bierze z app/version.py
# i wrzuca instalatory do wydania „v<wersja>" (to samo wydanie się nadpisuje, nowy numer = nowe
# wydanie). Ghostscript: Windows — oficjalny instalator Artifexu, Mac — zbudowany ze źródeł.
name: Instalatory

on:
  push:
    branches: [main]
    paths: ["app/**", "packaging/**", ".github/workflows/**"]
  workflow_dispatch:

# Domyślnie tylko odczyt; zapis (wydanie) ma wyłącznie zadanie „wydanie” (przegląd kodu B17).
permissions:
  contents: read

# Dwa szybkie wypchnięcia nie mogą się wyprzedzić — drugie czeka, aż pierwsze skończy (C24).
concurrency:
  group: instalatory-${{ github.ref }}
  cancel-in-progress: false

env:
  GS_VERSION: "10.07.1"
  PYTHON_VERSION: "3.12"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Wersja
        id: ver
        shell: bash
        run: echo "v=$(python -c "import re;print(re.search(r'VERSION\s*=\s*\"([^\"]+)\"',open('app/version.py',encoding='utf-8').read()).group(1))")" >> "$GITHUB_OUTPUT"
      - name: Ghostscript
        shell: pwsh
        timeout-minutes: 10
        run: |
          # Instalatora Ghostscripta NIE uruchamiamy (w środku odpala instalator Visual C++, który
          # na maszynie GitHuba wisiał bez końca) — rozpakowujemy go 7-Zipem.
          $tag = "gs" + ($env:GS_VERSION -replace '\.', '')
          $url = "https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/$tag/${tag}w64.exe"
          curl.exe -sSL -o gs_setup.exe $url
          if ($LASTEXITCODE -ne 0) { throw "Nie pobrałem Ghostscripta" }
          7z x gs_setup.exe -oC:\gsinst -y | Out-Null
          New-Item -ItemType Directory -Force build\gs\bin | Out-Null
          Copy-Item C:\gsinst\bin\gswin64c.exe, C:\gsinst\bin\gsdll64.dll build\gs\bin\
          # biblioteki Visual C++, których potrzebuje gsdll64.dll — obok programu, żeby działał
          # także na komputerze bez zainstalowanego pakietu Visual C++
          Copy-Item C:\Windows\System32\msvcp140.dll, C:\Windows\System32\vcruntime140.dll, C:\Windows\System32\vcruntime140_1.dll build\gs\bin\
          foreach ($d in "lib", "Resource", "iccprofiles") { Copy-Item -Recurse "C:\gsinst\$d" "build\gs\$d" }
          if (-not (Test-Path build\gs\iccprofiles\default_cmyk.icc)) { throw "Brak iccprofiles w Ghostscripcie" }
          Get-ChildItem build\gs\bin
          & build\gs\bin\gswin64c.exe --version
      - name: Python
        run: |
          python -m pip install --upgrade pip
          pip install -r packaging/requirements-build.txt
      - name: PyInstaller
        run: pyinstaller --noconfirm --distpath dist --workpath build/pyi packaging/adchecker.spec
      - name: Test uruchomienia
        shell: pwsh
        timeout-minutes: 15
        run: |
          $env:ADCHECK_SELFTEST = "1"
          $p = Start-Process -PassThru -Wait -FilePath dist\adChecker\adChecker.exe
          Get-Content "$env:LOCALAPPDATA\adChecker\adchecker.log" -Tail 40
          if ($p.ExitCode -ne 0) { throw "Test uruchomienia nie przeszedł (kod $($p.ExitCode))" }
      - name: Instalator (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.v }}" packaging\windows\adchecker.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup: błąd" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/adChecker-*-Windows-instalator.exe

  macos:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Wersja
        id: ver
        run: echo "v=$(python3 -c "import re;print(re.search(r'VERSION\s*=\s*\"([^\"]+)\"',open('app/version.py',encoding='utf-8').read()).group(1))")" >> "$GITHUB_OUTPUT"
      - name: Ghostscript (ze źródeł)
        run: bash packaging/build_gs_mac.sh "$GS_VERSION"
      - name: Python
        run: |
          python -m pip install --upgrade pip
          pip install -r packaging/requirements-build.txt
      - name: PyInstaller
        run: pyinstaller --noconfirm --distpath dist --workpath build/pyi packaging/adchecker.spec
      - name: Podpis (ad-hoc) i test uruchomienia
        timeout-minutes: 15
        run: |
          codesign --force --deep --sign - dist/adChecker.app
          codesign --verify --deep --strict dist/adChecker.app
          ADCHECK_SELFTEST=1 dist/adChecker.app/Contents/MacOS/adChecker
          tail -40 "$HOME/Library/Application Support/adChecker/adchecker.log"
      - name: DMG
        run: |
          mkdir -p build/dmg
          cp -R dist/adChecker.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname "adChecker" -srcfolder build/dmg -ov -format UDZO \
            "dist/adChecker-${{ steps.ver.outputs.v }}-macOS.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/adChecker-*-macOS.dmg

  wydanie:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: out
      # Wydanie powstaje TYLKO przy nowym numerze wersji (app/version.py). Zwykła zmiana to test:
      # instalatory leżą wtedy w „Artifacts" tego przebiegu, a ludzie nic nie dostają.
      - name: Wydanie na GitHubie (tylko nowa wersja)
        env:
          GH_TOKEN: ${{ github.token }}
          SIGN_KEY: ${{ secrets.ADCHECKER_SIGN_KEY }}
        run: |
          V=$(python3 -c "import re;print(re.search(r'VERSION\s*=\s*\"([^\"]+)\"',open('app/version.py',encoding='utf-8').read()).group(1))")
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Wersja $V jest już wydana — ta zmiana to TEST (instalatory w Artifacts tego przebiegu)."
            exit 0
          fi
          # numer z literami (np. 0.6-rc1) po cichu zablokowałby aktualizacje na zawsze (C24)
          if ! echo "$V" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            echo "Numer wersji „$V” musi mieć same cyfry i kropki (np. 0.6.1)."; exit 1
          fi
          mkdir -p rel && cp out/windows/*.exe out/macos/*.dmg rel/
          (cd rel && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # Podpis pliku sum (B16): klucz prywatny tylko w sekretach GitHuba (ADCHECKER_SIGN_KEY),
          # publiczny w programie (app/update_key.py). Program z kluczem nie zainstaluje wydania bez
          # podpisu, więc gdy klucz jest w programie, a sekretu brak — przerywamy, zanim coś wyjdzie.
          python3 - <<'PY'
          import base64, os, sys
          sys.path.insert(0, "app")
          import ed25519, update_key
          seed = os.environ.get("SIGN_KEY", "").strip()
          pub = update_key.PUBLIC_KEY.strip()
          if not seed:
              if pub:
                  sys.exit("Program ma klucz aktualizacji, a GitHub nie ma sekretu ADCHECKER_SIGN_KEY — wydanie bez podpisu zablokowałoby aktualizacje.")
              print("Bez podpisu (brak klucza w programie i w sekretach).")
              sys.exit(0)
          seed = base64.b64decode(seed)
          data = open("rel/SHA256SUMS.txt", "rb").read()
          sig = ed25519.sign(seed, data)
          if pub and ed25519.public_key(seed).hex() != pub:
              sys.exit("Sekret ADCHECKER_SIGN_KEY nie pasuje do klucza w app/update_key.py.")
          assert ed25519.verify(ed25519.public_key(seed), data, sig)
          open("rel/SHA256SUMS.txt.sig", "wb").write(base64.b64encode(sig) + b"\n")
          print("Podpisano SHA256SUMS.txt")
          PY
          gh release create "v$V" --title "adChecker $V" --target "$GITHUB_SHA" \
            --notes-file packaging/INSTRUKCJA.md rel/*
